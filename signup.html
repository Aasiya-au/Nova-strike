<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up | Nova Strike</title>
<meta name="description" content="Nova Strike: a 3D arcade space shooter in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Exo+2:wght@400;600&display=swap">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" class="auth-wrap">
  <section class="panel auth-card">
    <h1>Create your account</h1>
    <div id="form-message" aria-live="polite"></div>
    <form id="signup-form" novalidate>
      <div class="field"><label for="display-name">Display name</label>
        <input id="display-name" type="text" autocomplete="nickname" maxlength="80" required aria-describedby="display-name-error display-name-hint">
        <p class="hint" id="display-name-hint">Up to 40 characters. Any language or symbols.</p><p class="field-error" id="display-name-error"></p></div>
      <div class="field"><label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required aria-describedby="email-error"><p class="field-error" id="email-error"></p></div>
      <div class="field"><label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" required aria-describedby="password-error password-hint">
        <p class="hint" id="password-hint">At least 8 characters.</p><p class="field-error" id="password-error"></p></div>
      <button class="btn btn-primary" type="submit" id="submit-btn">Sign up</button>
    </form>
    <p class="auth-alt">Already a pilot? <a href="login.html">Log in</a></p>
  </section>
</main>
<script type="module" src="js/pages/signup.js"></script>
</body>
</html>
