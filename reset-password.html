<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password | Nova Strike</title>
<meta name="description" content="Nova Strike: a 3D arcade space shooter in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Exo+2:wght@400;600&display=swap">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" class="auth-wrap">
  <section class="panel auth-card">
    <h1>Choose a new password</h1>
    <div id="form-message" aria-live="polite"></div>
    <form id="reset-form" class="hidden" novalidate>
      <div class="field"><label for="password">New password</label>
        <input id="password" type="password" autocomplete="new-password" required aria-describedby="password-error password-hint">
        <p class="hint" id="password-hint">At least 8 characters.</p><p class="field-error" id="password-error"></p></div>
      <div class="field"><label for="confirm">Confirm new password</label>
        <input id="confirm" type="password" autocomplete="new-password" required aria-describedby="confirm-error"><p class="field-error" id="confirm-error"></p></div>
      <button class="btn btn-primary" type="submit" id="submit-btn">Save new password</button>
    </form>
    <p class="auth-alt" id="request-new" hidden><a href="forgot-password.html">Request a new reset link</a></p>
  </section>
</main>
<script type="module" src="js/pages/reset-password.js"></script>
</body>
</html>
